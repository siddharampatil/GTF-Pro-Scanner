name: GTF PRO Scanner V9

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 4-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gtf-pro-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V9 Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Run V9 Paper Monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py

      - name: Commit Signal and Trade History
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add signals.json trade_history.json

          if git diff --cached --quiet; then
            echo "No signal or trade-history changes to commit"
            exit 0
          fi

          git commit -m "GTF V9 update signals and paper trade history"

          git push origin HEAD:main