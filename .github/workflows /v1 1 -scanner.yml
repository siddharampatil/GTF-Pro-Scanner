name: GTF PRO SCANNER V11

on:
  workflow_dispatch:

  schedule:
    # Weekdays at 10:00 AM IST
    - cron: "30 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gtf-v11-dual-mode
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout V11 branch
        uses: actions/checkout@v4
        with:
          ref: v11-dual-mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance ta requests

      - name: Run V11 paper scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main_v11.py

      - name: Upload V11 paper results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-paper-results
          path: signals_v11.json
          if-no-files-found: ignore
          retention-days: 14
