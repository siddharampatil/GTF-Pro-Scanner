name: GTF PRO Monitor

on:
  workflow_dispatch:

  schedule:
    # Every 15 minutes during Indian market hours (Mon-Fri)
    - cron: "*/15 4-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gtf-pro-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Tracking Files
        run: |
          python - <<'PY'
          import json
          import os

          for filename in ["signals.json", "trade_history.json"]:
              if not os.path.exists(filename):
                  print(f"Creating missing file: {filename}")
                  with open(filename, "w", encoding="utf-8") as f:
                      json.dump([], f, indent=2)

              with open(filename, "r", encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, list):
                  raise ValueError(
                      f"{filename} must contain a JSON list. "
                      "Stopping to protect existing data."
                  )

              print(f"{filename}: {len(data)} records")
          PY

      - name: Run Monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "Starting GTF Monitor..."
          python -u monitor.py

      - name: Commit Updated Trade Records
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add signals.json trade_history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update trade monitoring records"
            git push
          else
            echo "No changes to commit."
          fi