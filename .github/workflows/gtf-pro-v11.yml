
name: GTF PRO V11 Scanner and Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 4-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gtf-pro-v11
  cancel-in-progress: false

jobs:
  run-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V11 Scanner and Monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u main.py

      - name: Commit Tracking Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add signals.json trade_history.json
          if ! git diff --cached --quiet; then
            git commit -m "GTF PRO V11 paper trading update"
            git push origin HEAD:main
          else
            echo "No tracking changes to commit."
          fi
